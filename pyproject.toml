[project]
name = "obsidian-local-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hannalychak", email = "hanna.lychak.25@kse.org.ua" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "fastembed>=0.8.0",
    "networkx>=3.6.1",
    "pandas>=3.0.5",
    "platformdirs>=4.11.8",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-frontmatter>=1.3.0",
    "qdrant-client>=1.19.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
obsidian-rag = "obsidian_local_rag.cli.app:app"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["networkx.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]
